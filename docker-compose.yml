version: '3.8'

services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: kitchen-backend
    env_file:
      - ./be/.env
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/kitchen_ecommerce?replicaSet=rs0
      PYTHON_AI_SERVICE_URL: http://python-ai:8000
      API_URL: ${API_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./be/uploads:/app/uploads
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      python-ai:
        condition: service_started
    restart: unless-stopped
    networks:
      - kitchen-network

  python-ai:
    build:
      context: ./py-ai
      dockerfile: Dockerfile
    container_name: kitchen-python-ai
    env_file:
      - ./py-ai/.env
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      MONGODB_URI: mongodb://mongodb:27017/kitchen_ecommerce?replicaSet=rs0
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5000
    volumes:
      - ./py-ai/data:/app/data
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - kitchen-network

  mongodb:
    image: mongo:7
    container_name: kitchen-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "localhost:27017", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - kitchen-network

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status()
          } catch (error) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            })
          }
        '
    restart: "no"
    networks:
      - kitchen-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    container_name: kitchen-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - kitchen-network

networks:
  kitchen-network:
    driver: bridge

volumes:
  mongodb_data:
